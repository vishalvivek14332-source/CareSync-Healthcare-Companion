services:
  - type: web
    name: caresync-backend
    env: node
    plan: free
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://caresync-backend.onrender.com,capacitor://localhost,http://localhost
      - key: STORAGE_PROVIDER
        value: local
